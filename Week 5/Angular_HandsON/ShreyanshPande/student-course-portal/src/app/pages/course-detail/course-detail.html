<div class="course-detail-container">
  @if (course) {
    <h2>{{ course.name }} Details</h2>
    <div class="detail-card">
      <p><strong>ID:</strong> {{ course.id }}</p>
      <p><strong>Code:</strong> {{ course.code }}</p>
      <p><strong>Credits:</strong> {{ course.credits ?? 'No Credits' }}</p>
      <p><strong>Status:</strong> <span class="status-badge" [class]="course.gradeStatus">{{ course.gradeStatus }}</span></p>
    </div>
  } @else {
    <h2>Course not found</h2>
  }

  <button routerLink="/courses" class="back-btn">Back to Courses</button>
</div>
