<div class="card">
  <h2>{{ course.name }}</h2>
  <p><strong>ID:</strong> {{ course.id }}</p>
  <p><strong>Code:</strong> {{ course.code }}</p>
  <p><strong>Credits:</strong> {{ course.credits }}</p>
  <button
    (click)="enrollRequested.emit(course.id)">
    Enroll
  </button>
  @switch (course.gradeStatus) {
    @case ('passed') {
      <span class="passed">
        Passed
      </span>
    }
    @case ('failed') {
      <span class="failed">
        Failed
      </span>
    }
    @case ('pending') {
      <span class="pending">
        Pending
      </span>
    }
  }
</div>
