<h1>{{ portalName }}</h1>

<p>
  This portal allows students to browse courses, enroll in classes,
  and manage their academic profile.
</p>

<!-- Property Binding -->
<button
  [disabled]="!isPortalActive"
  (click)="onEnrollClick()">
  Enroll Now
</button>

<!-- Event Binding Result -->
<p>{{ message }}</p>

<hr>

<h3>Course Search</h3>

<!--
[property] = One-way binding (Component → DOM)

[(ngModel)] = Two-way binding (DOM ↔ Component)
Changes in the UI update the component property,
and changes in the component property update the UI.
-->

<input
  type="text"
  [(ngModel)]="searchTerm"
  placeholder="Search courses">

<p>Searching for: {{ searchTerm }}</p>

<hr>

<div class="stats">
  <div class="card">
    <h3>Courses Available</h3>
    <p>{{courseAvailable}}</p>
  </div>

  <div class="card">
    <h3>Enrolled</h3>
    <p>3</p>
  </div>

  <div class="card">
    <h3>GPA</h3>
    <p>3.8</p>
  </div>
</div>

<hr>

<app-course-summary-widget></app-course-summary-widget>
