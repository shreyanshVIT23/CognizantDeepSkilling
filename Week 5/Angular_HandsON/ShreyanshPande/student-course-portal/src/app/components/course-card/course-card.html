<div
  class="card"
  [appHighlight]="'lightblue'"
  [ngClass]="cardClasses"
  [ngStyle]="borderStyles">
  <h2>{{ course.name }}</h2>
  <button (click)="toggleDetails()">
    {{ isExpanded ? 'Hide Details' : 'Show Details' }}
  </button>
  @if (isExpanded) {
    <p><strong>ID:</strong> {{ course.id }}</p>
    <p><strong>Code:</strong> {{ course.code }}</p>
    <p>
      <strong>Credits:</strong>
      {{ course.credits | creditLabel }}
    </p>
    <button
      (click)="toggleEnrollment()">
      {{ isEnrolled ? 'Unenroll' : 'Enroll' }}
    </button>
    @switch (course.gradeStatus) {
      @case ('passed') {
        <span class="passed">
          Passed
        </span>
      }
      @case ('failed') {
        <span class="failed">
          Failed
        </span>
      }
      @case ('pending') {
        <span class="pending">
          Pending
        </span>
      }
    }
  }
</div>
